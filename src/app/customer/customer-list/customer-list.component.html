<h3>Customers</h3>
@defer {
<div class="row pt-3">
  <div class="col">

      @if (!customers) {
        ... Loading
      }
      <table class="table">
        <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">First Name</th>
          <th scope="col">Last Name</th>
        </tr>
        </thead>
        <tbody>
          @for (customer of customers; track customer) {
            <tr>
              <td><a [routerLink]="['/customers', customer.id]"><i class="bi bi-arrow-right-circle"></i></a></td>
              <td>{{ customer.firstname }}</td>
              <td>{{ customer.lastname }}</td>
            </tr>
          }
        </tbody>
      </table>

  </div>
</div>
    <div class="row pt3">
        <div class="col">
            <a [routerLink]="['/create-customer']"  class="btn btn-outline-success">
                <i class="bi bi-person-plus"></i>&nbsp;
                <span>{{ 'Create Customer' }}</span>
            </a>
        </div>
    </div>
} @placeholder {
  ... Loading
}
