<h2 class="mb-3">Workflows</h2>
<div class="row">
    <div class="col">
        <b>Process name</b>
    </div>
    <div class="col-md">
        <b>Version</b>
    </div>
    <div class="col-md">
        <b>Running instances</b>
    </div>
    <div class="col">
        <b>link</b>
    </div>
</div>

@if (definitions && definitions.length === 0) {
    <p class="placeholder-glow">
        <span class="placeholder col-7"></span>
        <span class="placeholder col-4"></span>
        <span class="placeholder col-6"></span>
        <span class="placeholder col-7"></span>
        <span class="placeholder col-7"></span>
        <span class="placeholder col-2"></span>
        <span class="placeholder col-4"></span>
        <span class="placeholder col-7"></span>
    </p>
} @else {
    @for (definition of definitions; track definition) {
        @if (definition.runningInstances > 0) {
            <div class="row pt-3">
                <div class="col">
                    {{ definition.name }}
                </div>
                <div class="col-md">
                    {{ definition.version }}
                </div>
                <div class="col-md">
                    {{ definition.runningInstances }}
                </div>
                <div class="col">
                    <a [routerLink]="['/workflow', definition.key, definition.version]">
                        <fa-icon [icon]="faArrowAltCircleLeft"/>
                    </a>
                </div>
            </div>
        }
    }
}
